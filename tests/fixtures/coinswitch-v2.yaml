openapi: 3.0.3
info:
  title: CoinSwitch PRO Trading API (Spot & Futures)
  version: '2.0'
  x-swytchcode-namespace: coinswitch
  description: |-
    REST API for CoinSwitch PRO Spot (INR / USDT pairs) and USDT-margined perpetual Futures.

    Source documentation: https://api-trading.coinswitch.co/get-started/introduction

    ## Authentication

    Every request must be signed with Ed25519 and carry these headers, except the public
    endpoints `GET /trade/api/v2/time`, `GET /trade/api/v2/ping`,
    `GET /trade/api/v2/24hr/all-pairs/ticker` and `GET /trade/api/v2/futures/all-pairs/ticker`:

    | Header | Value |
    |---|---|
    | `X-AUTH-APIKEY` | Your API key (the Ed25519 public key, hex). |
    | `X-AUTH-SIGNATURE` | Ed25519 signature of the request, hex-encoded. |
    | `X-AUTH-EPOCH` | Current Unix time in **milliseconds**, as a decimal string. |
    | `Content-Type` | `application/json` |

    The signature is computed **per request** over the UTF-8 bytes of:

    ```
    signed_message = METHOD + path_with_query + epoch
    ```

    - `METHOD` - uppercase HTTP method (`GET`, `POST`, `DELETE`, `PUT`).
    - `path_with_query` - request path plus query string, **URL-decoded** (`+` -> space,
      `%2C` -> `,`, `%2F` -> `/`). Scheme and host are not included.
    - `epoch` - the exact value sent in `X-AUTH-EPOCH`.
    - The request **body is not signed**.

    Sign with your secret key (a 32-byte Ed25519 seed, hex) and hex-encode the 64-byte signature.

    Examples (epoch `1719905777483`):

    ```
    GET /trade/api/v2/time                -> "GET/trade/api/v2/time1719905777483"
    POST /trade/api/v2/order (any body)   -> "POST/trade/api/v2/order1719905777483"
    GET /trade/api/v2/orders?open=true&exchanges=coinswitchx,c2c1
                                          -> "GET/trade/api/v2/orders?open=true&exchanges=coinswitchx,c2c11719905777483"
    ```

    The epoch must be within +/-5,000 ms of server time (recommended); requests drifting more
    than 60,000 ms are rejected with `401 Invalid Access`. Use `GET /trade/api/v2/time` to
    read server time if the local clock is unreliable.

    Order lookups (`GET /trade/api/v2/order`, `GET /trade/api/v2/futures/order`) accept only
    `order_id`; there is no lookup by `client_order_id`. To reconcile a placement that timed
    out, list open/closed orders and match on `client_order_id`.

    A static header value cannot satisfy this scheme: `X-AUTH-SIGNATURE` and `X-AUTH-EPOCH`
    must be generated for every call. See `x-swytchcode-signing` on the `CoinSwitchSignature`
    security scheme for the machine-readable signing recipe.

    ## Conventions

    - Responses are wrapped as `{ "data": ... }`. Errors are `{ "message": "..." }`.
    - All timestamps are Unix milliseconds unless stated otherwise.
    - Spot symbols are `BASE/QUOTE` (e.g. `BTC/INR`); Futures symbols are `BASEUSDT` (e.g. `BTCUSDT`).
    - Spot returns numeric fields as numbers; Futures returns most numeric fields as strings.
    - Spot exchanges: `coinswitchx` (INR pairs), `c2c1` and `c2c2` (USDT pairs). Futures exchange: `EXCHANGE_2`.

    HFT and B2B endpoints live on a different host (`https://dma.coinswitch.co`) and are
    described in a separate spec (`coinswitch-hft`).
  contact:
    name: CoinSwitch API support
    email: api@coinswitch.co
    url: https://api-trading.coinswitch.co/
  termsOfService: https://api-trading.coinswitch.co/resources/terms
externalDocs:
  description: CoinSwitch PRO API documentation
  url: https://api-trading.coinswitch.co/get-started/introduction

servers:
  - url: https://coinswitch.co
    description: Production

security:
  - CoinSwitchApiKey: []
    CoinSwitchSignature: []
    CoinSwitchEpoch: []

tags:
  - name: General
    description: Server time, health check and key validation.
  - name: Spot Market Data
    description: Public spot market data (requests are still signed).
  - name: Spot Trading
    description: Spot orders, portfolio, fees and TDS.
  - name: Futures Market Data
    description: Futures instruments, tickers, order book, trades and candles.
  - name: Futures Trading
    description: Futures orders, positions, leverage, margin and wallet.

paths:
  # ---------------------------------------------------------------- General
  /trade/api/v2/time:
    get:
      operationId: getServerTime
      x-swytchcode-canonical-id: coinswitch.time.get
      tags: [General]
      summary: Get server time
      description: Returns the server clock. This is the only endpoint that does not require authentication. Use it to seed `X-AUTH-EPOCH` when the local clock is unreliable.
      security: []
      responses:
        '200':
          description: Server time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverTime:
                    type: integer
                    format: int64
                    description: Server time (Unix milliseconds).
              example:
                serverTime: 1719905777483

  /trade/api/v2/ping:
    get:
      operationId: ping
      x-swytchcode-canonical-id: coinswitch.ping.check
      tags: [General]
      summary: Health check
      description: Health check for the v2 trading API. Does not require authentication.
      security: []
      responses:
        '200':
          description: Service is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: OK

  /trade/api/v2/validate/keys:
    get:
      operationId: validateKeys
      x-swytchcode-canonical-id: coinswitch.keys.validate
      tags: [General]
      summary: Validate API keys
      description: Verifies that the API key, secret and signature are correct. Returns `Valid Access` on success.
      responses:
        '200':
          description: Keys are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Valid Access
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------- Spot market data
  /trade/api/v2/coins:
    get:
      operationId: getSpotActiveCoins
      x-swytchcode-canonical-id: coinswitch.spot.coins.list
      tags: [Spot Market Data]
      summary: List active coins
      description: List the trading symbols available on a given exchange.
      parameters:
        - $ref: '#/components/parameters/SpotExchangeQuery'
      responses:
        '200':
          description: Symbols keyed by exchange.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Keyed by exchange identifier; each value is an array of `BASE/QUOTE` symbols.
                    additionalProperties:
                      type: array
                      items:
                        type: string
              example:
                data:
                  coinswitchx: [BAT/INR, BNB/INR, BTC/INR, ETH/INR, MATIC/INR]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/24hr/all-pairs/ticker:
    get:
      operationId: getSpotAllPairsTicker
      x-swytchcode-canonical-id: coinswitch.spot.ticker.list
      tags: [Spot Market Data]
      summary: Get 24hr ticker for all pairs
      description: Returns 24hr stats for every symbol on an exchange. Does not require authentication.
      security: []
      parameters:
        - $ref: '#/components/parameters/SpotExchangeQuery'
      responses:
        '200':
          $ref: '#/components/responses/SpotTickerMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/24hr/ticker:
    get:
      operationId: getSpotTicker
      x-swytchcode-canonical-id: coinswitch.spot.ticker.get
      tags: [Spot Market Data]
      summary: Get 24hr ticker for a symbol
      description: Returns 24hr stats for a specific symbol. Accepts a comma-separated list of exchanges.
      parameters:
        - name: exchange
          in: query
          required: true
          description: Comma-separated list of exchange identifiers (`coinswitchx`, `c2c1`, `c2c2`), e.g. `coinswitchx,c2c1`.
          schema:
            type: string
          example: coinswitchx,c2c1
        - $ref: '#/components/parameters/SpotSymbolQuery'
      responses:
        '200':
          $ref: '#/components/responses/SpotTickerMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/depth:
    get:
      operationId: getSpotDepth
      x-swytchcode-canonical-id: coinswitch.spot.depth.get
      tags: [Spot Market Data]
      summary: Get order book depth
      description: Snapshot of the order book (bids and asks) for a symbol on a given exchange.
      parameters:
        - $ref: '#/components/parameters/SpotExchangeQuery'
        - $ref: '#/components/parameters/SpotSymbolQuery'
      responses:
        '200':
          description: Order book snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrderBook'
              example:
                data:
                  symbol: DOGE/INR
                  timestamp: 1686514361972
                  bids: [['5.82', '4350']]
                  asks: [['5.8664', '1238']]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/trades:
    get:
      operationId: getSpotTrades
      x-swytchcode-canonical-id: coinswitch.spot.trades.list
      tags: [Spot Market Data]
      summary: Get recent trades
      description: Recent public trades for a symbol on a given exchange.
      parameters:
        - $ref: '#/components/parameters/SpotExchangeQuery'
        - $ref: '#/components/parameters/SpotSymbolQuery'
      responses:
        '200':
          description: Recent trades.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpotTrade'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/candles:
    get:
      operationId: getSpotCandles
      x-swytchcode-canonical-id: coinswitch.spot.candles.list
      tags: [Spot Market Data]
      summary: Get candles
      description: Historical OHLCV candlestick data for a symbol.
      parameters:
        - $ref: '#/components/parameters/SpotExchangeQuery'
        - $ref: '#/components/parameters/SpotSymbolQuery'
        - name: interval
          in: query
          required: true
          description: Candle duration in minutes, e.g. 1, 5, 60, 1440.
          schema:
            type: integer
          example: 60
        - name: start_time
          in: query
          required: true
          description: Range start (Unix milliseconds).
          schema:
            type: integer
            format: int64
        - name: end_time
          in: query
          required: true
          description: Range end (Unix milliseconds).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Candles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/tradeInfo:
    get:
      operationId: getSpotTradeInfo
      x-swytchcode-canonical-id: coinswitch.spot.trade_info.get
      tags: [Spot Market Data]
      summary: Get trade info
      description: Min/max order value and precision for a symbol (or every symbol on the exchange when `symbol` is omitted). Use it to validate orders before submitting.
      parameters:
        - $ref: '#/components/parameters/SpotExchangeQuery'
        - name: symbol
          in: query
          required: false
          description: '`BASE/QUOTE`. If omitted, returns info for all symbols on the exchange.'
          schema:
            type: string
          example: BTC/INR
      responses:
        '200':
          description: Trade info keyed by exchange, then by symbol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        $ref: '#/components/schemas/SpotTradeInfo'
              example:
                data:
                  coinswitchx:
                    BTC/INR:
                      quote: { min: '150', max: '2500000' }
                      precision: { base: 6, quote: 2, limit: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/exchangePrecision:
    post:
      operationId: getSpotExchangePrecision
      x-swytchcode-canonical-id: coinswitch.spot.precision.get
      tags: [Spot Market Data]
      summary: Get exchange precision
      description: Price and quantity precision for a symbol (or every symbol on the exchange when `symbol` is omitted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exchange]
              properties:
                exchange:
                  $ref: '#/components/schemas/SpotExchange'
                symbol:
                  type: string
                  description: '`BASE/QUOTE`, e.g. `BTC/INR`. If omitted, returns precision for all symbols.'
            example:
              exchange: coinswitchx
              symbol: BTC/INR
      responses:
        '200':
          description: Precision keyed by exchange, then by symbol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        $ref: '#/components/schemas/SpotPrecision'
              example:
                data:
                  coinswitchx:
                    BTC/INR: { base: 5, quote: 2, limit: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------- Spot trading
  /trade/api/v2/order:
    post:
      operationId: createSpotOrder
      x-swytchcode-canonical-id: coinswitch.spot.order.create
      tags: [Spot Trading]
      summary: Create spot order
      description: 'Place a new spot limit order. Rate limit: 100 requests / 10 s.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, symbol, type, price, quantity, exchange]
              properties:
                side:
                  type: string
                  enum: [buy, sell]
                  description: buy or sell (case-insensitive).
                symbol:
                  type: string
                  description: '`BASE/QUOTE`, e.g. `BTC/USDT`, `BTC/INR`.'
                type:
                  type: string
                  enum: [LIMIT]
                  description: Order type. Only `LIMIT` is supported.
                price:
                  type: number
                  description: Limit price.
                quantity:
                  type: number
                  description: Base asset quantity.
                exchange:
                  $ref: '#/components/schemas/SpotExchange'
                client_order_id:
                  type: string
                  description: Idempotency key (UUID you generate). Re-sending the same value de-duplicates instead of placing twice.
                expiry_period:
                  type: integer
                  description: Order TTL in seconds. Default 90.
            example:
              side: sell
              symbol: BTC/USDT
              type: LIMIT
              price: 26000
              quantity: 0.0009
              exchange: c2c1
      responses:
        '200':
          $ref: '#/components/responses/SpotOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: getSpotOrder
      x-swytchcode-canonical-id: coinswitch.spot.order.get
      tags: [Spot Trading]
      summary: Get spot order
      description: Fetch the current state of a single order by `order_id`.
      parameters:
        - name: order_id
          in: query
          required: true
          description: The CoinSwitch order ID.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SpotOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: cancelSpotOrder
      x-swytchcode-canonical-id: coinswitch.spot.order.cancel
      tags: [Spot Trading]
      summary: Cancel spot order
      description: Cancel an open spot order. The status becomes `CANCELLATION_RAISED` until the exchange confirms, then `CANCELLED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  description: The order ID to cancel.
            example:
              order_id: 698ed406-8ef5-4664-9779-f7978702a447
      responses:
        '200':
          $ref: '#/components/responses/SpotOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/orders:
    get:
      operationId: listSpotOrders
      x-swytchcode-canonical-id: coinswitch.spot.orders.list
      tags: [Spot Trading]
      summary: List spot orders
      description: 'Open orders (`open=true`, default count 25) or closed orders (`open=false`, latest 500). Rate limit: 10000 requests / 10 s.'
      parameters:
        - name: open
          in: query
          required: true
          description: '`true` for open orders, `false` for closed.'
          schema:
            type: boolean
        - name: count
          in: query
          required: false
          description: Page size. Default 25 for open, 500 for closed.
          schema:
            type: integer
        - name: from_time
          in: query
          required: false
          description: Orders created at/after this time (Unix ms).
          schema:
            type: integer
            format: int64
        - name: to_time
          in: query
          required: false
          description: Orders created at/before this time (Unix ms).
          schema:
            type: integer
            format: int64
        - name: side
          in: query
          required: false
          schema:
            type: string
            enum: [buy, sell]
        - name: symbols
          in: query
          required: false
          description: Comma-separated symbols, e.g. `btc/inr,eth/inr`.
          schema:
            type: string
        - name: exchanges
          in: query
          required: false
          description: Comma-separated exchange identifiers, e.g. `coinswitchx,c2c1`.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Order type. Defaults to `LIMIT`.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by exact status. Used mainly with `open=false`.
          schema:
            $ref: '#/components/schemas/SpotOrderStatus'
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: '#/components/schemas/SpotOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /trade/api/v2/user/portfolio:
    get:
      operationId: getSpotPortfolio
      x-swytchcode-canonical-id: coinswitch.spot.portfolio.get
      tags: [Spot Trading]
      summary: Get portfolio
      description: 'Wallet holdings including balances blocked in open orders, average buy price and current INR value. Rate limit: 5000 requests / 10 s.'
      responses:
        '200':
          description: One entry per held asset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortfolioEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /trade/api/v2/tradingFee:
    get:
      operationId: getSpotTradingFee
      x-swytchcode-canonical-id: coinswitch.spot.trading_fee.get
      tags: [Spot Trading]
      summary: Get trading fee
      description: Maker/taker fee schedule for your account on an exchange, including active discounts.
      parameters:
        - $ref: '#/components/parameters/SpotExchangeQuery'
      responses:
        '200':
          description: Fees keyed by exchange, then by base asset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        $ref: '#/components/schemas/TradingFee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /trade/api/v2/tds:
    get:
      operationId: getSpotTds
      x-swytchcode-canonical-id: coinswitch.spot.tds.get
      tags: [Spot Trading]
      summary: Get TDS
      description: 'Cumulative TDS deducted on your trades for the current Indian financial year. C2C TDS is recorded with a 1-day delay. Rate limit: 25 requests / 10 s.'
      responses:
        '200':
          description: TDS summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_tds_amount:
                        type: number
                        description: Cumulative TDS in INR.
                      financial_year:
                        type: string
                        description: Indian financial year (April-March), e.g. `2024-2025`.
              example:
                data:
                  total_tds_amount: 459.12
                  financial_year: 2024-2025
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ---------------------------------------------------- Futures market data
  /trade/api/v2/futures/instrument_info:
    get:
      operationId: getFuturesInstrumentInfo
      x-swytchcode-canonical-id: coinswitch.futures.instruments.list
      tags: [Futures Market Data]
      summary: Get instrument info
      description: 'Trading rules, leverage limits, fees and tick size for every futures symbol. Rate limit: 100 requests / 60 s.'
      parameters:
        - name: exchange
          in: query
          required: false
          description: '`EXCHANGE_2`. If omitted, returns info for all futures exchanges.'
          schema:
            $ref: '#/components/schemas/FuturesExchange'
      responses:
        '200':
          description: Instruments keyed by symbol.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/FuturesInstrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /trade/api/v2/futures/ticker:
    get:
      operationId: getFuturesTicker
      x-swytchcode-canonical-id: coinswitch.futures.ticker.get
      tags: [Futures Market Data]
      summary: Get futures ticker
      description: '24-hour stats and funding info for one futures symbol. `data` is keyed by exchange identifier. Rate limit: 100 requests / 60 s.'
      parameters:
        - $ref: '#/components/parameters/FuturesExchangeQuery'
        - $ref: '#/components/parameters/FuturesSymbolQuery'
      responses:
        '200':
          $ref: '#/components/responses/FuturesTickerMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /trade/api/v2/futures/all-pairs/ticker:
    get:
      operationId: getFuturesAllPairsTicker
      x-swytchcode-canonical-id: coinswitch.futures.ticker.list
      tags: [Futures Market Data]
      summary: Get futures ticker for all pairs
      description: '24-hour stats for every futures symbol. `data` is keyed by symbol. Does not require authentication. Rate limit: 100 requests / 60 s.'
      security: []
      parameters:
        - $ref: '#/components/parameters/FuturesExchangeQuery'
      responses:
        '200':
          $ref: '#/components/responses/FuturesTickerMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /trade/api/v2/futures/order_book:
    get:
      operationId: getFuturesOrderBook
      x-swytchcode-canonical-id: coinswitch.futures.order_book.get
      tags: [Futures Market Data]
      summary: Get futures order book
      description: 'Top of book by default; send `l2Orderbook=true` for the deeper L2 view. Rate limit: 100 requests / 60 s (shared by both modes).'
      parameters:
        - $ref: '#/components/parameters/FuturesExchangeQuery'
        - $ref: '#/components/parameters/FuturesSymbolQuery'
        - name: l2Orderbook
          in: query
          required: false
