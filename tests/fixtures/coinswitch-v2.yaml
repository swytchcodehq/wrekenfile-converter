          type: array
          description: Sorted descending. Each entry is `[price, quantity]` as strings.
          items:
            type: array
            items:
              type: string
        asks:
          type: array
          description: Sorted ascending. Each entry is `[price, quantity]` as strings.
          items:
            type: array
            items:
              type: string

    SpotTrade:
      type: object
      properties:
        E:
          type: integer
          format: int64
          description: Event time (Unix ms).
