components:
  securitySchemes:
    CoinSwitchApiKey:
      type: apiKey
      in: header
      name: X-AUTH-APIKEY
      description: Your CoinSwitch API key (Ed25519 public key, hex). Static per account.
    CoinSwitchSignature:
      type: apiKey
      in: header
      name: X-AUTH-SIGNATURE
      description: |-
        Hex-encoded Ed25519 signature, generated per request with your secret key over
        `METHOD + url_decoded(path_with_query) + X-AUTH-EPOCH`. The body is not signed.
      # Signing recipe (Swytchcode recipe v1): the CLI evaluates it on every request.
      # Message = METHOD + URL-decoded path?query + epoch (ms); the body is not signed.
      x-swytchcode-signing:
        version: 1
        credentials:
          - {name: api_key, label: API key}
          - {name: secret_key, label: Secret key, secret: true, encoding: hex}
        steps:
          - {id: ts, op: time, unit: ms}
          - {id: msg, op: concat, parts: ['{method}', '{path_query_decoded}', '{ts}']}
          - {id: sig, op: sign, alg: ed25519, key: secret_key, input: '{msg}', output: hex}
        set:
          headers:
            X-AUTH-APIKEY: '{api_key}'
            X-AUTH-EPOCH: '{ts}'
            X-AUTH-SIGNATURE: '{sig}'
        sensitive: [X-AUTH-SIGNATURE]
        verify: {method: GET, path: /trade/api/v2/validate/keys}
        time_sync: {path: /trade/api/v2/time, json_path: serverTime, unit: ms, proactive: true}
    CoinSwitchEpoch:
      type: apiKey
      in: header
      name: X-AUTH-EPOCH
      description: |-
        Current Unix time in milliseconds (decimal string), generated per request. Must equal the
        epoch used in the signed message. Keep within +/-5,000 ms of server time; more than
        60,000 ms of drift is rejected.

  parameters:
    SpotExchangeQuery:
      name: exchange
      in: query
      required: true
      description: Spot exchange identifier (case-insensitive). `coinswitchx` = INR pairs; `c2c1`, `c2c2` = USDT pairs.
      schema:
        $ref: '#/components/schemas/SpotExchange'
    SpotSymbolQuery:
      name: symbol
      in: query
      required: true
      description: '`BASE/QUOTE`, e.g. `BTC/INR`, `BTC/USDT` (case-insensitive).'
      schema:
        type: string
      example: BTC/INR
    FuturesExchangeQuery:
      name: exchange
      in: query
      required: true
      description: Futures exchange identifier. Always `EXCHANGE_2`.
      schema:
        $ref: '#/components/schemas/FuturesExchange'
    FuturesSymbolQuery:
      name: symbol
      in: query
      required: true
      description: '`BASEUSDT`, e.g. `BTCUSDT` (case-insensitive).'
      schema:
        type: string
      example: BTCUSDT

  responses:
    BadRequest:
      description: Request rejected, e.g. insufficient balance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Amount is more than available balance
    Unauthorized:
      description: Bad API key or signature, or `X-AUTH-EPOCH` outside the drift window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Invalid Access
    ValidationError:
      description: A field is missing or has an invalid value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Input symbol is missing
    RateLimited:
      description: Rate limit exceeded (limits are per API key). Back off and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    SpotOrderResponse:
      description: Order.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/SpotOrder'
          example:
            data:
              order_id: 927db2d9-643c-47a3-9c0f-78741ac95cf5
              symbol: BTC/USDT
              price: 26000
              average_price: 0
              orig_qty: 0.0009
              executed_qty: 0
              status: OPEN
              side: SELL
              exchange: c2c1
              order_source: API_TRADING
              created_time: 1689661638000
              updated_time: 1689661639000
    SpotTickerMap:
      description: 24hr tickers keyed by symbol.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SpotTicker'
    FuturesTickerMap:
      description: Futures tickers in an object (keyed by exchange for a single symbol, by symbol for all pairs).
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/FuturesTicker'
    FuturesOrderList:
      description: Orders plus a pagination cursor.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/FuturesOrder'
                  cursor:
                    type: integer
                    format: int64
                    description: Unix ms of the oldest entry returned. Pass as `to_time` to fetch the next page.
    FuturesLeverage:
      description: Leverage on the symbol.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  exchange:
                    type: string
                  symbol:
                    type: string
                  leverage:
                    type: string
          example:
            data:
              exchange: EXCHANGE_2
              symbol: BTCUSDT
              leverage: '13'

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string

    SpotExchange:
      type: string
      enum: [coinswitchx, c2c1, c2c2]
      description: '`coinswitchx` = INR pairs; `c2c1`, `c2c2` = USDT (crypto-to-crypto) pairs.'

    FuturesExchange:
      type: string
      enum: [EXCHANGE_2]

    SpotOrderStatus:
      type: string
      enum: [OPEN, PARTIALLY_EXECUTED, EXECUTED, CANCELLED, EXPIRED, DISCARDED, CANCELLATION_RAISED, EXPIRATION_RAISED]
      description: '`PARTIALLY_EXECUTED`, `CANCELLATION_RAISED` and `EXPIRATION_RAISED` are non-terminal in Spot.'

    FuturesOrderStatus:
      type: string
      enum: [RAISED, EXECUTED, PARTIALLY_EXECUTED, CANCELLED, CANCELLATION_RAISED]
      description: '`PARTIALLY_EXECUTED` is terminal in Futures.'

    SpotOrder:
      type: object
      properties:
        order_id:
          type: string
          description: CoinSwitch order ID (UUID).
        client_order_id:
          type: string
          description: Echo of the client-supplied ID, when sent.
        symbol:
          type: string
        price:
          type: number
        average_price:
          type: number
          description: Average fill price; 0 until any fill.
        orig_qty:
          type: number
        executed_qty:
          type: number
        status:
          $ref: '#/components/schemas/SpotOrderStatus'
        side:
          type: string
          enum: [BUY, SELL]
        exchange:
          type: string
        order_source:
          type: string
          description: Always `API_TRADING` for orders placed via this API.
        created_time:
          type: integer
          format: int64
        updated_time:
          type: integer
          format: int64

    SpotTicker:
      type: object
      properties:
        symbol:
          type: string
        exchange:
          type: string
        openPrice:
          type: string
        lowPrice:
          type: string
        highPrice:
          type: string
        lastPrice:
          type: string
        baseVolume:
          type: string
        quoteVolume:
          type: string
        percentageChange:
          type: string
        bidPrice:
          type: string
        askPrice:
          type: string
        at:
          type: integer
          format: int64
