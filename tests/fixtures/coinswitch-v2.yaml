  # -------------------------------------------------------- Futures trading
  /trade/api/v2/futures/order:
    post:
      operationId: placeFuturesOrder
      x-swytchcode-canonical-id: coinswitch.futures.order.create
      tags: [Futures Trading]
      summary: Place futures order
      description: |-
        Place a new futures order. Rate limit: 20 requests / 60 s.

        For TP/SL (`TAKE_PROFIT_MARKET` / `STOP_MARKET`) send `quantity: 0`, a `trigger_price`
        and `reduce_only: true`; these apply to the whole open position on the symbol.

        If the response status is `RAISED`, poll Get Futures Order until a terminal status.
        Unlike Spot, `PARTIALLY_EXECUTED` is terminal in Futures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exchange, symbol, side, order_type, quantity]
              properties:
                exchange:
                  $ref: '#/components/schemas/FuturesExchange'
                symbol:
                  type: string
                  description: '`BASEUSDT`, e.g. `BTCUSDT`, `DOGEUSDT` (case-insensitive).'
                side:
                  type: string
                  enum: [BUY, SELL]
                  description: BUY or SELL (case-insensitive).
                order_type:
                  type: string
                  enum: [MARKET, LIMIT, TAKE_PROFIT_MARKET, STOP_MARKET]
                price:
                  type: number
                  description: Limit price. Required for `LIMIT`; ignored otherwise.
                quantity:
                  type: number
                  description: Base-asset quantity. Send 0 for `TAKE_PROFIT_MARKET` and `STOP_MARKET`.
                trigger_price:
                  type: number
                  description: Trigger price. Required for `TAKE_PROFIT_MARKET` / `STOP_MARKET`.
                reduce_only:
                  type: boolean
                  description: Must be `true` for `TAKE_PROFIT_MARKET` / `STOP_MARKET`. Optional for `LIMIT`.
                time_in_force:
                  type: string
                  enum: [GTC, IOC, FOK]
                  default: GTC
                client_order_id:
                  type: string
                  description: Client-supplied UUID echoed back in order responses; use it to reconcile retries.
            example:
              exchange: EXCHANGE_2
              symbol: dogeusdt
              side: BUY
              order_type: LIMIT
              price: 0.28
              quantity: 22
      responses:
        '200':
          description: Order accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FuturesOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: getFuturesOrder
      x-swytchcode-canonical-id: coinswitch.futures.order.get
      tags: [Futures Trading]
      summary: Get futures order status
      description: 'Fetch a single futures order. The order is wrapped in `data.order`. Rate limit: 20 requests / 60 s.'
      parameters:
        - name: order_id
          in: query
          required: true
          description: The CoinSwitch order ID.
          schema:
            type: string
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/FuturesOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: cancelFuturesOrder
      x-swytchcode-canonical-id: coinswitch.futures.order.cancel
      tags: [Futures Trading]
      summary: Cancel futures order
      description: 'Cancel a single open futures order. The status is `CANCELLATION_RAISED` until the exchange confirms. Rate limit: 10 requests / 60 s.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exchange, order_id]
              properties:
                exchange:
                  $ref: '#/components/schemas/FuturesExchange'
                order_id:
                  type: string
                  description: The order ID to cancel.
            example:
              exchange: EXCHANGE_2
              order_id: 698ed406-8ef5-4664-9779-f7978702a447
      responses:
        '200':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FuturesCancelledOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

