        symbol:
          type: string
        interval:
          type: string
          description: Interval in minutes.
        start_time:
          type: string
          description: Candle start (Unix ms).
        close_time:
          type: string
          description: Candle close (Unix ms).

    SpotPrecision:
      type: object
      properties:
        base:
          type: integer
          description: Decimal places for quantity.
        quote:
          type: integer
          description: Decimal places for price.
        limit:
          type: integer
          description: Limit-order precision adjustment (typically 0).

    SpotTradeInfo:
      type: object
      properties:
        quote:
          type: object
          properties:
            min:
