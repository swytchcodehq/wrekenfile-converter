          type: boolean
          description: true if the buyer was the maker.
        p:
          type: string
          description: Price.
        q:
          type: string
          description: Quantity (base asset).
        s:
          type: string
          description: Symbol.
        t:
          type: string
          description: Trade ID (UUID).
        e:
          type: string
          description: Exchange identifier.

